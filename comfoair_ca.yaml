button:
  - platform: template
    id: fan_low
    name: "Fan Low"
    on_press:
      - lambda: |-
          auto call = id(comfoair_climate).make_call();
          call.set_fan_mode(climate::CLIMATE_FAN_LOW);
          call.perform();
  - platform: template
    id: fan_medium
    name: "Fan Medium"
    on_press:
      - lambda: |-
          auto call = id(comfoair_climate).make_call();
          call.set_fan_mode(climate::CLIMATE_FAN_MEDIUM);
          call.perform();
  - platform: template
    id: fan_high
    name: "Fan High"
    on_press:
      - lambda: |-
          auto call = id(comfoair_climate).make_call();
          call.set_fan_mode(climate::CLIMATE_FAN_HIGH);
          call.perform();

  # ---- Resets (Tier 1: safe) ----
  - platform: template
    id: reset_filter
    name: "Reset Filter Counter"
    icon: "mdi:air-filter"
    on_press:
      - lambda: |-
          id(comfoair_climate).filter_reset();
  - platform: template
    id: reset_errors
    name: "Reset Errors"
    icon: "mdi:alert-remove"
    on_press:
      - lambda: |-
          id(comfoair_climate).error_reset();

  # ---- Resets / self-test (Tier 2: advanced, use with care) ----
  - platform: template
    id: start_self_test
    name: "Start Self-Test"
    icon: "mdi:cog-play"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(comfoair_climate).start_self_test();
  - platform: template
    id: reset_to_factory_settings
    name: "Reset Unit To Factory Settings"
    icon: "mdi:restore-alert"
    entity_category: config
    on_press:
      - lambda: |-
          ESP_LOGW("custom", "Resetting ComfoAir unit settings to factory defaults");
          id(comfoair_climate).settings_reset();

  # ---- Tier 3: start a timed preheater override (fixed duration) ----
  # The matching ON/OFF state is the "Preheater Override (test mode)" switch
  # below. This button just kicks off a 60s burst; the switch shows it active.
  - platform: template
    id: force_preheater_60s
    name: "Force Preheater (60s burst)"
    icon: "mdi:heating-coil"
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to use test-mode override"); return; }
          ESP_LOGW("custom", "FORCING preheater via test mode for 60s");
          id(comfoair_climate).force_preheater(60, 0x03);

switch:
  - platform: factory_reset
    id: restart_with_factory_default_settings
    name: Restart with Factory Default Settings
    icon: mdi:restart-alert
  - platform: template
    name: "Developer Mode"
    id: developer_mode
    icon: "mdi:bug"
    lambda: |-
      return id(comfoair_climate).get_developer_mode();
    turn_on_action:
      - lambda: |-
          id(comfoair_climate).set_developer_mode(true);
    turn_off_action:
      - lambda: |-
          id(comfoair_climate).set_developer_mode(false);
  - platform: template
    name: "Supply Shutoff"
    id: supply_shutoff
    icon: "mdi:fan-off"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      // Check if all levels are zero
      return (id(comfoair_climate).get_supply_absent_level() == 0) &&
             (id(comfoair_climate).get_supply_low_level() == 0) &&
             (id(comfoair_climate).get_supply_medium_level() == 0) &&
             (id(comfoair_climate).get_supply_high_level() == 0);
    
    turn_on_action:
      - lambda: |-
          ESP_LOGD("custom", "Supply Shutoff turn_on_action");
          id(stored_sup_abs) = id(comfoair_climate).get_supply_absent_level();
          id(stored_sup_low) = id(comfoair_climate).get_supply_low_level();
          id(stored_sup_med) = id(comfoair_climate).get_supply_medium_level();
          id(stored_sup_hig) = id(comfoair_climate).get_supply_high_level();
          
          id(comfoair_climate).set_supply_levels(0, 0, 0, 0);

    turn_off_action:
      - lambda: |-
          ESP_LOGD("custom", "Supply Shutoff turn_off_action");
          if (id(stored_sup_abs) == 0) id(stored_sup_abs) = 15;
          if (id(stored_sup_low) == 0) id(stored_sup_low) = 35;
          if (id(stored_sup_med) == 0) id(stored_sup_med) = 50;
          if (id(stored_sup_hig) == 0) id(stored_sup_hig) = 70;
          id(comfoair_climate).set_supply_levels(id(stored_sup_abs), id(stored_sup_low), id(stored_sup_med), id(stored_sup_hig));

  # ========================================================================
  # Tier 2: Unit configuration / option flags - CMD_SET_STATUS (0xD7)
  # These tell the unit what hardware it has. Writing wrong values can disable
  # sensors or heating, so each write is gated behind Developer Mode. Values
  # are read-modify-written so untouched flags are preserved.
  # NOTE: the "Preheater Present" byte position is UNVERIFIED on the WHR 930
  # (sources disagree: registers.h byte0 vs openHAB options-bit 0x40). Verify
  # by round-tripping before relying on it.
  # ========================================================================
  - platform: template
    name: "Config: Preheater Present"
    id: cfg_preheater_present
    icon: "mdi:heating-coil"
    entity_category: config
    lambda: |-
      return id(comfoair_climate).get_cfg_preheater_present();
    turn_on_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_preheater_present(true);
    turn_off_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_preheater_present(false);
  - platform: template
    name: "Config: Bypass Present"
    id: cfg_bypass_present
    icon: "mdi:valve"
    entity_category: config
    lambda: |-
      return id(comfoair_climate).get_cfg_bypass_present();
    turn_on_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_bypass_present(true);
    turn_off_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_bypass_present(false);
  - platform: template
    name: "Config: Fireplace Present"
    id: cfg_fireplace_present
    icon: "mdi:fireplace"
    entity_category: config
    lambda: |-
      return id(comfoair_climate).get_cfg_fireplace_present();
    turn_on_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_fireplace_present(true);
    turn_off_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_fireplace_present(false);
  - platform: template
    name: "Config: Kitchen Hood Present"
    id: cfg_kitchen_hood_present
    icon: "mdi:stove"
    entity_category: config
    lambda: |-
      return id(comfoair_climate).get_cfg_kitchen_hood_present();
    turn_on_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_kitchen_hood_present(true);
    turn_off_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_kitchen_hood_present(false);
  - platform: template
    name: "Config: Post-Heating Present"
    id: cfg_postheating_present
    icon: "mdi:radiator"
    entity_category: config
    lambda: |-
      return id(comfoair_climate).get_cfg_postheating_present();
    turn_on_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_postheating_present(true);
    turn_off_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_postheating_present(false);
  - platform: template
    name: "Config: Post-Heating PWM Mode"
    id: cfg_postheating_pwm
    icon: "mdi:radiator"
    entity_category: config
    lambda: |-
      return id(comfoair_climate).get_cfg_postheating_pwm_present();
    turn_on_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_postheating_pwm_present(true);
    turn_off_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          id(comfoair_climate).set_cfg_postheating_pwm_present(false);

  # ========================================================================
  # Tier 3: Preheater override via TEST MODE (DANGEROUS)
  # Turning this ON enters test mode and drives the preheater relay+triac for a
  # long window (1 hour), re-asserting periodically. Test mode SUSPENDS the
  # unit's own regulation, including automatic frost protection. Turning it OFF
  # (or the auto-timeout) exits test mode and restores normal operation.
  # The switch state reflects the actual test-mode state reported by the unit.
  # ========================================================================
  - platform: template
    name: "Preheater Override (test mode)"
    id: preheater_override
    icon: "mdi:heating-coil"
    entity_category: config
    lambda: |-
      return id(comfoair_climate).get_test_mode_active();
    turn_on_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to use test-mode override"); return; }
          ESP_LOGW("custom", "Preheater override ON - entering test mode (self-regulation suspended)");
          // Hold for up to 1 hour; toggle off to end sooner.
          id(comfoair_climate).force_preheater(3600, 0x03);
    turn_off_action:
      - lambda: |-
          id(comfoair_climate).stop_test_mode_override();

number:
  - platform: template
    name: "Set Supply Absent Level"
    id: supply_absent_level
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    set_action:
      - lambda: |-
          id(comfoair_climate).set_supply_absent_level(static_cast<uint8_t>(x));
    lambda: |-
      return id(comfoair_climate).get_supply_absent_level();
