substitutions:
  node_name: comfoair
  device_name: ComfoAir
  description: ComfoAir Controller
  developer: JEMOER
  entity_prefix: ''

globals:
  - id: stored_sup_abs
    type: int
    restore_value: yes
  - id: stored_sup_low
    type: int
    restore_value: yes
  - id: stored_sup_med
    type: int
    restore_value: yes
  - id: stored_sup_hig
    type: int
    restore_value: yes

esp32:
  board: esp32dev
  framework:
    type: esp-idf
  
esphome:
  name: ${node_name}
  comment: ${device_name}
  friendly_name: "${device_name}"
  name_add_mac_suffix: false
  project:
    name: "${developer}.${description}"
    version: 1.1.8

external_components:
  - source:
      type: git
      url: https://github.com/yannickvr/esphome-comfoair
    components: [comfoair_ca]
  # - source: components
  #   components: [comfoair_ca]

dashboard_import:
  package_import_url: github://yannickvr/esphome-comfoair/comfoair_ca.yaml
  import_full_config: false

wifi:
  ap:
    ssid: ${node_name}-setup
    password: ${node_name}setup

esp32_improv:
  authorizer: none

captive_portal:

# Disable uart logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:

ota:
  platform: esphome

web_server:
  version: 3

output:
  - platform: gpio
    id: orange_led_out
    pin: GPIO18
  - platform: gpio
    id: green_led_out
    pin: GPIO19

interval:
  - interval: 1s
    then:
      if:
        condition:
          wifi.connected:
        then:
          - output.turn_off: green_led_out
        else:
          - output.turn_on: green_led_out
          - delay: 500ms
          - output.turn_off: green_led_out
  - interval: 500ms
    then:
      if:
        condition:
          api.connected:
        then:
          - output.turn_off: orange_led_out
        else:
          - if:
              condition:
                wifi.connected
              then:
                - output.turn_on: orange_led_out
                - delay: 250ms
                - output.turn_off: orange_led_out
              else:
                - output.turn_off: orange_led_out

sensor:
  - platform: uptime
    name: "${entity_prefix} Uptime"
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s

binary_sensor:
  - platform: gpio
    pin: GPIO4
    id: factory_reset_button
    name: "Factory Reset Button"
    on_press:
      then:
        - switch.turn_on: restart_with_factory_default_settings

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true

uart:
  id: uart_bus
  baud_rate: 9600
  tx_pin: 17
  rx_pin: 16

