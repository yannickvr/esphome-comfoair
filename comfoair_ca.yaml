select:
  # ========================================================================
  # Tier 2: Unit configuration enums - CMD_SET_STATUS (0xD7)
  # Gated behind Developer Mode; read-modify-written. Advanced / installer.
  # ========================================================================
  - platform: template
    name: "Config: Unit Type"
    id: cfg_unit_type
    icon: "mdi:air-conditioner"
    entity_category: config
    options:
      - "Left"
      - "Right"
    lambda: |-
      switch (id(comfoair_climate).get_cfg_type()) {
        case 1: return std::string("Left");
        case 2: return std::string("Right");
        default: return std::string("Left");
      }
    set_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          uint8_t v = (x == "Right") ? 2 : 1;
          id(comfoair_climate).set_cfg_type(v);
  - platform: template
    name: "Config: Unit Size"
    id: cfg_unit_size
    icon: "mdi:resize"
    entity_category: config
    options:
      - "Large"
      - "Small"
    lambda: |-
      switch (id(comfoair_climate).get_cfg_size()) {
        case 1: return std::string("Large");
        case 2: return std::string("Small");
        default: return std::string("Large");
      }
    set_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          uint8_t v = (x == "Small") ? 2 : 1;
          id(comfoair_climate).set_cfg_size(v);
  - platform: template
    name: "Config: Enthalpy Present"
    id: cfg_enthalpy_present
    icon: "mdi:water-percent"
    entity_category: config
    options:
      - "Absent"
      - "Present"
      - "Without sensor"
    lambda: |-
      switch (id(comfoair_climate).get_cfg_enthalpy_present()) {
        case 0: return std::string("Absent");
        case 1: return std::string("Present");
        case 2: return std::string("Without sensor");
        default: return std::string("Absent");
      }
    set_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          uint8_t v = 0;
          if (x == "Present") v = 1;
          else if (x == "Without sensor") v = 2;
          id(comfoair_climate).set_cfg_enthalpy_present(v);
  - platform: template
    name: "Config: EWT Present"
    id: cfg_ewt_present
    icon: "mdi:heat-pump"
    entity_category: config
    options:
      - "Absent"
      - "Regulated"
      - "Unregulated"
    lambda: |-
      switch (id(comfoair_climate).get_cfg_ewt_present()) {
        case 0: return std::string("Absent");
        case 1: return std::string("Regulated");
        case 2: return std::string("Unregulated");
        default: return std::string("Absent");
      }
    set_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          uint8_t v = 0;
          if (x == "Regulated") v = 1;
          else if (x == "Unregulated") v = 2;
          id(comfoair_climate).set_cfg_ewt_present(v);
  - platform: template
    name: "Config: Analog Priority"
    id: cfg_analog_priority
    icon: "mdi:priority-high"
    entity_category: config
    options:
      - "Analog inputs"
      - "Weekly program"
    lambda: |-
      return (id(comfoair_climate).get_analog_priority() == 1)
        ? std::string("Weekly program")
        : std::string("Analog inputs");
    set_action:
      - lambda: |-
          if (!id(comfoair_climate).get_developer_mode()) { ESP_LOGW("custom", "Enable Developer Mode to change config flags"); return; }
          uint8_t v = (x == "Weekly program") ? 1 : 0;
          id(comfoair_climate).set_analog_priority(v);
