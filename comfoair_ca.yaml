    update_interval: 5s

  # ========================================================================
  # Tier 1: Time delays (menu P2) - CMD_SET_TIME_DELAY (0xCB)
  # ========================================================================
  - platform: template
    name: "Bathroom Switch On Delay"
    id: set_bathroom_on_delay
    icon: "mdi:timer-cog"
    entity_category: config
    min_value: 0
    max_value: 15
    step: 1
    unit_of_measurement: "min"
    set_action:
      - lambda: |-
